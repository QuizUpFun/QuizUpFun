<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QuizUp Admin - Teste de Login</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#222;
}

.login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
background:#fff;
width:100%;
max-width:430px;
padding:30px;
border-radius:18px;
box-shadow:0 8px 30px rgba(0,0,0,.12);
text-align:center;
}

h1{
margin-top:0;
}

input{
width:100%;
padding:14px;
margin:8px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
border:0;
border-radius:10px;
padding:14px;
font-size:16px;
cursor:pointer;
background:#111827;
color:#fff;
margin-top:10px;
}

button:disabled{
opacity:.6;
}

.message{
padding:14px;
border-radius:10px;
margin-top:15px;
text-align:left;
word-break:break-word;
}

.info{
background:#e0f2fe;
color:#075985;
}

.success{
background:#dcfce7;
color:#166534;
}

.error{
background:#fee2e2;
color:#991b1b;
}

.debug{
margin-top:20px;
padding:12px;
background:#f3f4f6;
border-radius:10px;
font-size:12px;
text-align:left;
word-break:break-word;
}

#result{
display:none;
}

</style></head><body><div class="login"><div class="login-box"><h1>QuizUp Admin</h1><p>Teste exclusivo de login</p><input
id="email"
type="email"
placeholder="E-mail"
autocomplete="username">

<input
id="password"
type="password"
placeholder="Senha"
autocomplete="current-password">

<button
id="loginButton"
type="button">
Entrar
</button>

<div id="message"></div><div id="result" class="debug"></div><div class="debug"><b>Projeto:</b><br>
6a8e10e900245502244c

<br><br>

<b>Administrador esperado:</b><br>
6a8f41f10032758d44de

<br><br>

<b>Endpoint:</b><br>
https://fra.cloud.appwrite.io/v1

</div></div></div><script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script><script>

"use strict";


/* ================================
   CONFIGURAÇÃO
================================ */

const ENDPOINT =
"https://fra.cloud.appwrite.io/v1";

const PROJECT_ID =
"6a8e10e900245502244c";

const ADMIN_USER_ID =
"6a8f41f10032758d44de";


/* ================================
   ELEMENTOS
================================ */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");

const result =
document.getElementById("result");


/* ================================
   APPWRITE
================================ */

let account = null;


function mostrarMensagem(
texto,
tipo="info"
){

message.innerHTML =
'<div class="message '+
tipo+
'">'+
texto+
'</div>';

}


function mostrarResultado(
texto
){

result.style.display =
"block";

result.innerHTML =
texto;

}


/* ================================
   INICIAR APPWRITE
================================ */

try{

if(!window.Appwrite){

throw new Error(
"O SDK do Appwrite não carregou."
);

}


console.log(
"Appwrite encontrado:",
window.Appwrite
);


const client =
new Appwrite.Client();


client
.setEndpoint(ENDPOINT)
.setProject(PROJECT_ID);


account =
new Appwrite.Account(client);


mostrarMensagem(
"Appwrite carregado. Digite o e-mail e a senha.",
"info"
);


}catch(error){

console.error(
"ERRO AO INICIAR:",
error
);

mostrarMensagem(
"ERRO AO INICIAR APPWRITE: "+
(error.message || error),
"error"
);

}


/* ================================
   LOGIN
================================ */

async function fazerLogin(){

const email =
emailInput.value.trim();

const password =
passwordInput.value;


result.style.display =
"none";


if(!email){

mostrarMensagem(
"Digite o e-mail.",
"error"
);

return;

}


if(!password){

mostrarMensagem(
"Digite a senha.",
"error"
);

return;

}


if(!account){

mostrarMensagem(
"Appwrite não foi inicializado.",
"error"
);

return;

}


loginButton.disabled =
true;

loginButton.textContent =
"Entrando...";


try{

mostrarMensagem(
"1/3 — Enviando e-mail e senha ao Appwrite...",
"info"
);


console.log(
"LOGIN INICIADO"
);

console.log(
"E-mail:",
email
);

console.log(
"Senha enviada:",
password.length > 0
);


const session =
await account.createEmailPasswordSession({

email:email,

password:password

});


console.log(
"SESSÃO RECEBIDA:",
session
);


mostrarMensagem(
"2/3 — Login aceito pelo Appwrite. Buscando usuário...",
"info"
);


const user =
await account.get();


console.log(
"USUÁRIO:",
user
);


mostrarMensagem(
"3/3 — Usuário encontrado.",
"success"
);


mostrarResultado(

"<b>LOGIN FUNCIONOU!</b><br><br>"+

"<b>ID do usuário:</b><br>"+
String(user.$id)+

"<br><br>"+

"<b>E-mail:</b><br>"+
String(user.email || "-")+

"<br><br>"+

"<b>Nome:</b><br>"+
String(user.name || "-")+

"<br><br>"+

"<b>ID esperado do administrador:</b><br>"+
ADMIN_USER_ID+

"<br><br>"+

(
user.$id === ADMIN_USER_ID
?
"<b>ADMINISTRADOR CONFIRMADO.</b>"
:
"<b>ATENÇÃO:</b> o login funcionou, mas o ID deste usuário é diferente do ID configurado como administrador."
)

);


}catch(error){

console.error(
"ERRO COMPLETO:",
error
);


let texto =
"ERRO REAL: "+
(error?.message || String(error));


if(error?.code){

texto +=
"<br><br><b>Código:</b> "+
error.code;

}


if(error?.type){

texto +=
"<br><br><b>Tipo:</b> "+
error.type;

}


if(error?.response){

try{

texto +=
"<br><br><b>Resposta:</b><br>"+
JSON.stringify(error.response);

}catch(e){}

}


mostrarMensagem(
texto,
"error"
);


mostrarResultado(

"<b>O LOGIN NÃO FOI CONCLUÍDO.</b><br><br>"+

"Mensagem: "+
(error?.message || "-")+

"<br><br>"+

"Código: "+
(error?.code || "-")+

"<br><br>"+

"Tipo: "+
(error?.type || "-")

);


}finally{

loginButton.disabled =
false;

loginButton.textContent =
"Entrar";

}

}


/* ================================
   EVENTOS
================================ */

loginButton.addEventListener(
"click",
fazerLogin
);


passwordInput.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

fazerLogin();

}

);


emailInput.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

passwordInput.focus();

}

);


/* ================================
   ERROS GERAIS
================================ */

window.addEventListener(
"error",
function(event){

console.error(
"ERRO JAVASCRIPT:",
event.error ||
event.message
);

}
);


window.addEventListener(
"unhandledrejection",
function(event){

console.error(
"PROMISE REJEITADA:",
event.reason
);

}
);

</script></body>
 </html>
